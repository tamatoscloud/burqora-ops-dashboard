name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-build:
    name: Tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # BUR-25: a failing test fails this job.
      - name: Tests (assign, hard reset, attendance view)
        run: npm test
      - name: Typecheck + build
        run: npm run build
